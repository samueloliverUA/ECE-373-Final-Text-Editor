# build.yml  -  Owner: Jack (Reviewer: Sam)  -  Week of Oct 28
# Lives at the repository root: GitHub only runs workflows from /.github/workflows.
# Runs `mvn clean test` on every pull request and push to main (design doc 7.2 'Always green', 6.9.9).
# WHAT TO DO: commit with pom.xml; in GitHub settings, protect main and require this check to pass before merging.
name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: document-editor   # the Maven project is in this folder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: document-editor/pom.xml
      - run: mvn -B clean test
